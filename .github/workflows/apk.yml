# Costruisce l'APK Android e lo allega alla release.
#
# PERCHE' ESISTE: index.html punta a releases/latest/download/forexbacktestlab.apk. Ogni release
# che esce senza APK allegato rompe quel collegamento, perche' "latest" e' cambiata: i telefoni
# chiedono di aggiornarsi, scaricano un 404 (o lo stesso APK di prima) e restano indietro per
# sempre. E' gia' successo con la 2.0.36 e con la 2.0.37.
#
# L'APK si porta dentro TUTTO il sito (e' un'app Capacitor senza server.url), quindi ogni
# versione ha bisogno del SUO APK: non basta riallegare quello vecchio.
#
# Vedi cervello/GUIDA-APK-AUTOMATICO.md.

name: APK Android

# NON SI ASPETTA L'EVENTO "release pubblicata": NON ARRIVA MAI.
#
# MISURATO il 28 ottobre 2026, dopo tre release senza APK: GitHub NON fa partire un flusso in
# risposta a un evento creato col token automatico (github.token). E' una regola voluta, serve a
# impedire che un flusso ne inneschi un altro all'infinito. La release la crea il flusso
# "Installer Windows" con quel token, quindi l'evento viene soffocato in silenzio - nessun
# errore, nessun avviso, solo una release senza APK e il collegamento di scarico rotto.
#
# LA CURA: non due flussi che si rincorrono, ma UN GIRO SOLO. Installer Windows, subito dopo aver
# creato la release, CHIAMA questo (vedi il lavoro "apk" in installer.yml). Dentro lo stesso giro
# non serve nessun evento, quindi non c'e' niente da soffocare.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag della release a cui allegare l'APK"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release a cui allegare l'APK (es. v2.0.38)"
        required: true

permissions:
  contents: write          # serve per allegare il file alla release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repo
        uses: actions/checkout@v4

      - name: Quale release, e quale versione
        id: ver
        run: |
          TAG="${{ inputs.tag }}"
          # La versione e' quella del sito, non quella del tag: la fonte di verita' e' sw.js,
          # lo stesso numero che l'app confronta per decidere se e' aggiornata.
          VER=$(grep -oP 'forex-backtest-lab-v\K[0-9.]+' sw.js | head -1)
          if [ -z "$VER" ]; then echo "versione non trovata in sw.js"; exit 1; fi
          # Android decide se un APK e' piu' nuovo dal versionCode, non dal nome: 2.0.37 -> 20037.
          IFS=. read -r A B C <<< "$VER"
          CODE=$(( A*10000 + B*100 + C ))
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "ver=$VER"   >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Release $TAG, versione $VER, versionCode $CODE"

      - name: Prepara i file del sito dentro www
        run: |
          # Gli stessi file che copia aggiorna_www.bat sul computer, piu' l'index.html di
          # mobile/www-sorgente: quello NON e' una copia del sito, e' un file suo che
          # preconfigura l'indirizzo del server Oracle e poi apre app.html.
          mkdir -p mobile/www
          cp app.html login.html sw.js manifest.json asset-library.html \
             informativa-bot.html privacy.html rischi-finanziari.html termini.html \
             icon-192.png icon-512.png mobile/www/
          cp mobile/www-sorgente/index.html mobile/www/index.html
          ls -la mobile/www/

      - name: Inietta la versione in app.html
        run: |
          # Lo stesso script usato sul computer, con UTF-8 esplicito. Senza, le emoji diventano
          # "ðŸ..." e TUTTE le icone dell'app si rompono dentro l'APK (successo nella 2.0.27).
          python3 strumenti/inietta_versione.py mobile/www/app.html "${{ steps.ver.outputs.ver }}"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'      # Gradle 8.14 non regge Java 25: la JDK si dichiara, non si eredita

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          # Capacitor 8.5.3 pretende Node >= 22 (lo dichiara in package.json). Col 20 `npm ci`
          # passa lasciando solo un avviso EBADENGINE, e poi `cap sync` muore con exit 1 senza
          # dire perche': l'unico indizio e' quell'avviso tre righe sopra. Misurato il 28 ottobre
          # 2026, primo tentativo di questo flusso. Se un giorno si alza Capacitor, va riguardato
          # anche questo numero.
          node-version: '22'

      - name: Installa Capacitor e sincronizza
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Ricostruisci la chiave di firma dal segreto
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Manca il segreto ANDROID_KEYSTORE_BASE64. Vedi cervello/GUIDA-APK-AUTOMATICO.md, passo 3."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fbl.jks"
          # Si controlla che sia una chiave vera PRIMA di compilare: un base64 incollato a meta'
          # produrrebbe un errore di Gradle incomprensibile venti minuti dopo.
          keytool -list -keystore "$RUNNER_TEMP/fbl.jks" \
                  -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >/dev/null
          echo "chiave di firma pronta"

      - name: Compila l'APK di rilascio
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/fbl.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PfblVersionName=${{ steps.ver.outputs.ver }} \
            -PfblVersionCode=${{ steps.ver.outputs.code }}

      - name: Controlla che sia firmato davvero
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "::error::APK non prodotto"; exit 1; fi
          cp "$APK" "$RUNNER_TEMP/forexbacktestlab.apk"
          # Un APK non firmato si installa su nessun telefono: meglio fermarsi qui che
          # pubblicare un file che nessuno riesce a installare.
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs "$RUNNER_TEMP/forexbacktestlab.apk" | head -5
          ls -la "$RUNNER_TEMP/forexbacktestlab.apk"

      - name: Allega l'APK alla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" \
             "$RUNNER_TEMP/forexbacktestlab.apk" --clobber --repo "${{ github.repository }}"
          echo "APK allegato a ${{ steps.ver.outputs.tag }}"
