# Collaudo automatico a ogni modifica: sintassi dell'app, ponte Python (conto Kraken simulato,
# ordini pendenti), interprete dei segnali, app nel browser. Gli screenshot e il riassunto si
# scaricano da "Artifacts". Rosso = qualcosa si e' rotto: non pubblicare quella versione.
name: Collaudo

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  collaudo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Librerie
        run: |
          pip install -q pytest fastapi pydantic httpx
          cd laboratorio && npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Collaudo
        run: bash laboratorio/collauda.sh
      - name: Riassunto
        if: always()
        run: cat laboratorio/risultati/ultimo.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collaudo
          path: laboratorio/risultati/
          retention-days: 14

  server_oracle:
    # Il pacchetto del server Oracle: l'immagine si costruisce, i due servizi partono, il ponte
    # risponde e rifiuta chi arriva "via Tailscale" senza chiave.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Immagine e avvio
        run: |
          sudo mkdir -p /srv/fbl/dati
          docker compose -f server_oracle/docker-compose.yml up -d --build
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          echo
          curl -fsS http://127.0.0.1:8000/health | grep -q '"servizio":"server-oracle"'
          curl -fsS http://127.0.0.1:8769/health | grep -q '"ok":true'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 100.1.2.3' -H 'Host: server.tail.ts.net' http://127.0.0.1:8000/health)
          test "$code" = "403"
          echo "server Oracle: ok (senza chiave via Tailscale -> $code)"
      - name: Log dei servizi
        if: always()
        run: docker compose -f server_oracle/docker-compose.yml logs --tail 50
