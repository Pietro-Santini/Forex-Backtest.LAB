# Collaudo automatico a ogni modifica: sintassi dell'app, ponte Python (conto Kraken simulato,
# ordini pendenti), interprete dei segnali, app nel browser. Gli screenshot e il riassunto si
# scaricano da "Artifacts". Rosso = qualcosa si e' rotto: non pubblicare quella versione.
name: Collaudo

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  collaudo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Librerie
        run: |
          pip install -q pytest fastapi pydantic
          cd laboratorio && npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Collaudo
        run: bash laboratorio/collauda.sh
      - name: Riassunto
        if: always()
        run: cat laboratorio/risultati/ultimo.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collaudo
          path: laboratorio/risultati/
          retention-days: 14
