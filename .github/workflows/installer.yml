# Costruisce il Setup di Forex Backtest LAB su un PC Windows di GitHub: nessun PC di casa serve.
# Il risultato (ForexBacktestLAB_Setup.exe) si scarica dalla pagina Actions -> questa esecuzione ->
# "Artifacts". Parte da solo quando cambiano i sorgenti dell'installer o l'app, oppure a mano
# (Actions -> Installer Windows -> Run workflow).
name: Installer Windows

on:
  workflow_dispatch:
    inputs:
      pubblica:
        description: "Crea anche la release su GitHub (si')"
        type: boolean
        default: false
  push:
    paths:
      - "installer_build/**"
      - "app.html"
      - "sw.js"
      - ".github/workflows/installer.yml"

jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # build_exe.bat e' lo stesso script che si lancia a mano sul PC. "< NUL" fa passare i "pause".
      - name: Exe con PyInstaller (build_exe.bat)
        shell: cmd
        run: |
          call installer_build\build_exe.bat < NUL
          if not exist installer_build\dist\ForexBacktestLAB.exe exit /b 1
          if not exist installer_build\dist\Mt5FeedServer.exe exit /b 1
          if not exist installer_build\dist\SegnaliBridge.exe exit /b 1

      - name: Collaudo librerie del ponte segnali
        if: always()
        shell: cmd
        run: if exist installer_build\collaudo_ponte.txt type installer_build\collaudo_ponte.txt

      # LA VERSIONE DEL SETUP SI RICAVA DA sw.js, non si scrive a mano. Prima restava ferma:
      # quattro Setup diversi dello stesso giorno si chiamavano tutti "1.0.77", e chi li aveva
      # installati non poteva sapere quale fosse il suo.
      # SCHEMA 2.0.1 (proprietario, 18 ottobre 2026): CACHE_NAME "forex-backtest-lab-v2.0.1"
      # da "2.0.1", e il Setup/prendi il nome PER INTERO — piu' non c'e' il prefisso "1.0.".
      # Il grep deve avere i punti nel gruppo: "forex-backtest-lab-v[0-9]*" si ferma al primo
      # punto e prendeva solo "2".
      - name: Versione del Setup dalla versione dell'app
        shell: bash
        run: |
          APP=$(grep -o 'forex-backtest-lab-v[0-9][0-9.]*' sw.js | head -1 | sed 's/.*-v//')
          test -n "$APP"
          sed -i 's/^#define MyAppVersion ".*"/#define MyAppVersion "'"${APP}"'"/' installer_build/installer.iss
          grep -n 'MyAppVersion "' installer_build/installer.iss

      - name: Setup con Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer_build\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ForexBacktestLAB_Setup
          path: installer_build/Output/ForexBacktestLAB_Setup.exe
          retention-days: 30

  # Release automatica: per ogni versione arrivata su main (o a mano con "pubblica"). Nome dalla
  # versione dell'app (CACHE_NAME di sw.js) e del Setup (installer.iss); allegati: il Setup e lo zip
  # dei sorgenti dell'installer; descrizione scritta da sola con commit e file aggiunti/cambiati/tolti
  # rispetto alla release precedente.
  release:
    needs: setup
    if: github.ref == 'refs/heads/main' || inputs.pubblica
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Il tag esce da qui per il lavoro "apk" qui sotto: e' la release appena creata, e senza
    # saperne il nome l'APK non saprebbe dove allegarsi.
    outputs:
      tag: ${{ steps.info.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ForexBacktestLAB_Setup
          path: uscita
      - name: Nome, note e allegati
        id: info
        run: |
          APP=$(grep -o 'forex-backtest-lab-v[0-9][0-9.]*' sw.js | head -1 | sed 's/.*-v//')
          test -n "$APP"
          # LA STESSA FONTE del passo che ha compilato il Setup. Questo lavoro fa un checkout suo:
          # leggere installer.iss qui darebbe il numero scritto nel file, non quello compilato.
          SETUP="${APP}"
          TAG="v${SETUP}"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null && TAG="${TAG}-${GITHUB_RUN_NUMBER}"
          # I match servono sia per lo schema vecchio (v1.0.*) sia per quello nuovo (v2.0.*):
          # senza il secondo, dalla prima release 2.0.x in poi "rispetto a" resterebbe vuoto.
          PREC=$(git describe --tags --abbrev=0 --match 'v1.0.*' --match 'v2.0.*' 2>/dev/null || true)
          RANGE=${PREC:+$PREC..}HEAD
          {
            echo "## Forex Backtest LAB ${SETUP}"
            echo
            echo "Scarica **ForexBacktestLAB_Setup.exe** qui sotto e installalo: il Setup chiude da solo i programmi vecchi."
            echo "Windows può avvisare (SmartScreen) perché il programma non è firmato: \"Ulteriori informazioni\" → \"Esegui comunque\"."
            echo
            echo "### Cosa è cambiato${PREC:+ rispetto a $PREC}"
            git log --no-merges --pretty='- %s' $RANGE | head -60
            echo
            echo "### File"
            git diff --name-status ${PREC:-$(git rev-list --max-parents=0 HEAD | tail -1)} HEAD | awk '{ s=$1; f=$NF; if(s~/^A/)a=a"- ➕ "f"\n"; else if(s~/^D/)d=d"- ➖ "f"\n"; else m=m"- ✏️ "f"\n" } END{ printf "**Aggiunti**\n%s\n**Cambiati**\n%s\n**Tolti**\n%s", (a?a:"- nessuno\n"), (m?m:"- nessuno\n"), (d?d:"- nessuno\n") }' | head -120
          } > note.md
          cd installer_build && zip -qr ../uscita/installer_build.zip . -x 'venv/*' 'dist/*' 'Output/*' && cd ..
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "titolo=Forex Backtest LAB ${SETUP}" >> "$GITHUB_OUTPUT"
      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.info.outputs.tag }}" uscita/ForexBacktestLAB_Setup.exe uscita/installer_build.zip \
            --target "$GITHUB_SHA" --title "${{ steps.info.outputs.titolo }}" --notes-file note.md

  # L'APK, DENTRO LO STESSO GIRO.
  #
  # Non e' un flusso separato che aspetta l'evento "release pubblicata": quell'evento, creato col
  # token automatico, GitHub non lo propaga (vedi la spiegazione lunga in apk.yml). Per tre
  # release di fila l'APK e' semplicemente non arrivato, e il collegamento di scarico per Android
  # dava 404 senza che niente lo segnalasse.
  #
  # Chiamandolo da qui il problema non esiste: stesso giro, nessun evento di mezzo.
  apk:
    needs: release
    # I PERMESSI LI DA' CHI CHIAMA. Quelli scritti dentro un flusso chiamato vengono ignorati:
    # senza questa riga l'APK si costruirebbe e poi non riuscirebbe ad allegarsi alla release.
    permissions:
      contents: write
    uses: ./.github/workflows/apk.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
