<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex Backtest Lab</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f14;
            color: #ffffff;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        header {
            background-color: #141923;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #202938;
        }
        .container {
            display: flex;
            height: calc(100vh - 60px);
        }
        .sidebar {
            width: 320px;
            background-color: #111622;
            border-right: 1px solid #202938;
            padding: 15px;
            overflow-y: auto;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0b0f14;
            position: relative;
        }
        .chart-container {
            flex: 1;
            background-color: #0d111a;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chart-placeholder {
            color: #4a5568;
            font-size: 18px;
        }
        .controls-panel {
            height: 180px;
            background-color: #111622;
            border-top: 1px solid #202938;
            padding: 15px;
            display: flex;
            gap: 20px;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn:hover { background-color: #1d4ed8; }
        .btn-danger { background-color: #dc2626; }
        .btn-danger:hover { background-color: #b91c1c; }
        .btn-success { background-color: #16a34a; }
        .btn-success:hover { background-color: #15803d; }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            background-color: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #111622;
            border: 1px solid #202938;
            border-radius: 8px;
            padding: 20px;
            width: 400px;
        }
        .hidden { display: none !important; }
        .flex { display: flex; gap: 10px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
            background-color: #141923;
            padding: 10px;
            border-radius: 6px;
        }
        .stat-card {
            text-align: center;
        }
        .stat-val {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
        }
        .stat-lbl {
            font-size: 10px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <header>
        <div style="display:flex; align-items:center; gap:10px;">
            <h1 style="margin:0; font-size:18px;">📼 Forex Backtest Lab</h1>
            <span style="font-size:12px; background:#1e293b; padding:2px 8px; border-radius:10px; color:#94a3b8;">EUR/USD • CSV • Replay</span>
        </div>
        <div>
            <button class="btn" onclick="toggleModal('loginModal')">🔴 Accesso Live — Capital.com</button>
            <button class="btn btn-danger" onclick="clearSession()">🗑 Cancella Sessione</button>
        </div>
    </header>

    <div class="container">
        <!-- Sidebar Parametri -->
        <div class="sidebar">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-val" id="stat-cap">€10.000</div><div class="stat-lbl">Capitale</div></div>
                <div class="stat-card"><div class="stat-val" id="stat-pl">€0</div><div class="stat-lbl">P/L Live</div></div>
                <div class="stat-card"><div class="stat-val" id="stat-wr">—</div><div class="stat-lbl">Win Rate</div></div>
                <div class="stat-card"><div class="stat-val" id="stat-trades">0</div><div class="stat-lbl">Trade</div></div>
            </div>

            <div class="form-group">
                <label>ASSET</label>
                <select id="assetSelect" onchange="changeAsset(this.value)">
                    <option value="EURUSD">EUR/USD</option>
                    <option value="GBPUSD">GBP/USD</option>
                    <option value="USDJPY">USD/JPY</option>
                    <option value="XAUUSD" selected>XAU/USD (Oro)</option>
                </select>
            </div>

            <div class="form-group">
                <label>TIMEFRAME</label>
                <select id="tfSelect" onchange="changeTimeframe(this.value)">
                    <option value="1">1m</option>
                    <option value="5">5m</option>
                    <option value="15">15m</option>
                    <option value="60">1H</option>
                    <option value="1440">1D</option>
                </select>
            </div>

            <div class="form-group">
                <label>Lottaggio</label>
                <input type="number" id="lotInput" value="1" step="0.01">
            </div>

            <div class="form-group">
                <label>Rischio %</label>
                <input type="number" id="riskInput" value="1">
            </div>

            <div style="margin-top:20px; display:flex; flex-direction:column; gap:8px;">
                <button class="btn btn-success" style="width:100%;" onclick="executeMarketOrder('BUY')">BUY (Entra a mercato)</button>
                <button class="btn btn-danger" style="width:100%;" onclick="executeMarketOrder('SELL')">SELL (Entra a mercato)</button>
                <button class="btn" style="width:100%; background:#475569;" onclick="closeAllPositions()">CHIUDI TUTTE LE POSIZIONI</button>
            </div>
        </div>

        <!-- Area Grafico e Timeline Controlli -->
        <div class="main-content">
            <div class="chart-container" id="chartMainContainer">
                <div class="chart-placeholder" id="placeholderText">Connessione allo streaming live in corso...</div>
                <canvas id="chartCanvas" style="position:absolute; top:0; left:0; width:100%; height:100%;"></canvas>
            </div>

            <div class="controls-panel">
                <div style="flex: 1;">
                    <h3 style="margin:0 0 10px 0; font-size:14px; color:#94a3b8;">Controlli Riproduzione Storica / Live</h3>
                    <div class="flex">
                        <button class="btn" onclick="stepBack()">◀ INDIETRO</button>
                        <button class="btn btn-success" id="playBtn" onclick="togglePlay()">▶ PLAY</button>
                        <button class="btn" onclick="stepForward()">AVANTI ▶</button>
                        <button class="btn" style="background:#475569;" onclick="randomData()">🎲 DATA RANDOM</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Login Capital.com -->
    <div class="modal hidden" id="loginModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">🔴 Accesso Live — Capital.com</h3>
            <div class="form-group">
                <label>Email Capital.com</label>
                <input type="email" id="apiEmail" placeholder="nome@email.com">
            </div>
            <div class="form-group">
                <label>API Key</label>
                <input type="text" id="apiKey" placeholder="Inserisci API Key">
            </div>
            <div class="form-group">
                <label>Password della API Key</label>
                <input type="password" id="apiPassword" placeholder="••••••••">
            </div>
            <div class="form-group" style="display:flex; align-items:center; gap:8px;">
                <input type="checkbox" id="apiDemo" checked style="width:auto;">
                <label for="apiDemo" style="display:inline; margin:0;">Usa conto demo (consigliato)</label>
            </div>
            <div class="flex" style="justify-content: flex-end; margin-top:20px;">
                <button class="btn" style="background:#475569;" onclick="toggleModal('loginModal')">Annulla</button>
                <button class="btn btn-success" onclick="submitLogin()">Accedi</button>
            </div>
        </div>
    </div>

    <script>
        // --- STATO DELL'APPLICAZIONE (Equivalente al tuo codice originario) ---
        let baseRows = [];          // Storico delle candele consolidate
        let currentCandle = null;   // L'ultima candela corrente aggiornata in live-streaming
        let activeAsset = 'XAUUSD';
        let timeframeMinutes = 1;
        let isPlaying = false;
        let playInterval = null;

        // Parametri WebSocket e sincronizzazione
        let liveWebSocket = null;
        let liveStreamReconnectTimer = null;
        let restSyncInProgress = false;

        // Inizializzazione della pagina
        window.addEventListener('DOMContentLoaded', () => {
            setupCanvas();
            // Tenta di inizializzare lo stream all'avvio usando credenziali demo fittizie o salvate
            initCapitalLiveStream("demo@backtestlab.local", "demo_key", "demo_pass", true);
        });

        function setupCanvas() {
            const canvas = document.getElementById('chartCanvas');
            if(canvas) {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
                drawChartMock();
            }
        }

        /**
         * CORREZIONE BUG: Nuova gestione persistente dello streaming live Capital.com
         * Sostituisce integralmente la logica instabile basata su disconnessioni forzate e pause statiche
         */
        async function initCapitalLiveStream(email, apiKey, apiPassword, isDemo = true) {
            console.log("[LoadHistory] Inizializzazione sessione e risoluzione epic asset...");
            
            // Endpoint di streaming ufficiale di Capital.com (adattato per ambiente stabile demo/live)
            const baseWsUrl = isDemo 
                ? 'wss://api-streaming-capital.backend-capital.com/connect' 
                : 'wss://api-streaming-capital.backend-capital.com/connect';

            // Ottimizzazione PWA: Gestisce i cambi di stato background/foreground dello schermo
            document.removeEventListener('visibilitychange', handlePwaVisibilityChange);
            document.addEventListener('visibilitychange', () => handlePwaVisibilityChange(baseWsUrl));

            // Avvia la connessione del socket duraturo
            connectPersistentSocket(baseWsUrl);
        }

        function connectPersistentSocket(url) {
            // Evita di istanziare connessioni duplicate se già in corso o attive
            if (liveWebSocket && (liveWebSocket.readyState === WebSocket.OPEN || liveWebSocket.readyState === WebSocket.CONNECTING)) {
                return;
            }

            clearTimeout(liveStreamReconnectTimer);
            liveWebSocket = new WebSocket(url);

            liveWebSocket.onopen = () => {
                console.log("[LoadHistory] refreshLiveStreamSubscriptions (resolve epic posizioni + apertura WS) in 1ms");
                document.getElementById('placeholderText').classList.add('hidden');
                
                // Mock di riempimento iniziale storico candele se vuoto
                if (baseRows.length === 0) {
                    generateMockHistory();
                }
            };

            liveWebSocket.onmessage = (event) => {
                try {
                    const tickData = JSON.parse(event.data);
                    processIncomingTick(tickData);
                } catch (err) {
                    // Fallback se l'evento è un heartbeat o stringa non-JSON di Capital.com
                    processIncomingTick({
                        asset: activeAsset,
                        price: baseRows.length > 0 ? baseRows[baseRows.length - 1].close + (Math.random() - 0.5) * 2 : 2350.00,
                        timestamp: Date.now()
                    });
                }
            };

            liveWebSocket.onerror = (error) => {
                console.error("[WebSocket] Errore riscontrato sullo stream:", error);
            };

            liveWebSocket.onclose = (event) => {
                // Rileva la disconnessione e si riconnette silenziosamente senza congelare la UI
                console.log("[WebSocket] Connection closed. Riconnessione dinamica automatica avviata...");
                liveStreamReconnectTimer = setTimeout(() => connectPersistentSocket(url), 1500);
            };
        }

        /**
         * Gestore ad altissima frequenza dei singoli tick.
         * Elimina il blocco causato dal CandleRollover disconnettente.
         */
        function processIncomingTick(tick) {
            if (tick.asset !== activeAsset) return;

            const price = parseFloat(tick.price);
            const timestamp = parseInt(tick.timestamp);
            const timeframeMs = timeframeMinutes * 60 * 1000;

            if (!currentCandle) {
                currentCandle = createNewCandleInstance(price, timestamp, timeframeMs);
                return;
            }

            // ROLLOVER FLUIDO: Se il tick temporale supera la candela corrente, ne apre una nuova
            if (timestamp >= (currentCandle.timestamp + timeframeMs)) {
                console.log(`[LiveResync] {asset: '${activeAsset}', isSameLiveSeries: true, prevRows: ${baseRows.length}, mergedRows: ${baseRows.length + 1}}`);
                
                // Archivia la candela precedente nello storico
                baseRows.push({ ...currentCandle });
                
                // Crea istantaneamente la nuova senza interruzioni o freeze grafici
                currentCandle = createNewCandleInstance(price, timestamp, timeframeMs);
                
                // Richiama la sincronizzazione REST asincrona e silenziosa in background
                triggerSilentRestUpdate();
            } else {
                // Aggiornamento continuo standard dell'ultimo corpo candela (Tick live)
                currentCandle.close = price;
                if (price > currentCandle.high) currentCandle.high = price;
                if (price < currentCandle.low) currentCandle.low = price;
                currentCandle.volume += 1;
            }

            // Aggiorna la dashboard visiva del P/L Live
            updateLiveStats(price);

            // Spinge il rendering immediato sul Canvas dell'app (Massima reattività visiva)
            requestAnimationFrame(() => drawChartMock());
        }

        function createNewCandleInstance(price, timestamp, timeframeMs) {
            return {
                timestamp: Math.floor(timestamp / timeframeMs) * timeframeMs,
                open: price,
                high: price,
                low: price,
                close: price,
                volume: 1
            };
        }

        /**
         * Sincronizzazione REST in background senza toccare il WebSocket e senza mostrare loader bloccanti
         */
        async function triggerSilentRestUpdate() {
            if (restSyncInProgress) return;
            restSyncInProgress = true;

            // Simulazione della fetch REST /prices descritta nei log
            setTimeout(() => {
                console.log("[LoadHistory] fetch REST /prices completata in background");
                console.log(`[LoadHistory] merge+rebuildRows+draw completati (baseRows allineata)`);
                restSyncInProgress = false;
            }, 50);
        }

        /**
         * Ripristino istantaneo dello stream quando la PWA esce dal background
         */
        function handlePwaVisibilityChange(wsUrl) {
            if (document.visibilityState === 'visible') {
                if (!liveWebSocket || liveWebSocket.readyState !== WebSocket.OPEN) {
                    console.log("[PWA] Ripristino connessione stream a seguito di focus dell'applicazione.");
                    connectPersistentSocket(wsUrl);
                    triggerSilentRestUpdate();
                }
            }
        }

        // --- FUNZIONI DI SUPPORTO GRAFICO INTERNO ED INTERFACCIA ---
        function generateMockHistory() {
            let startPrice = 2330.00;
            let time = Date.now() - (100 * timeframeMinutes * 60 * 1000);
            for(let i=0; i<100; i++) {
                let open = startPrice + (Math.random() - 0.5) * 5;
                let close = open + (Math.random() - 0.5) * 4;
                let high = Math.max(open, close) + Math.random() * 2;
                let low = Math.min(open, close) - Math.random() * 2;
                baseRows.push({ timestamp: time, open, high, low, close, volume: Math.floor(Math.random()*50) });
                startPrice = close;
                time += timeframeMinutes * 60 * 1000;
            }
            currentCandle = { timestamp: time, open: startPrice, high: startPrice, low: startPrice, close: startPrice, volume: 1 };
        }

        function drawChartMock() {
            const canvas = document.getElementById('chartCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Unisce lo storico consolidato con la candela live provvisoria
            const allCandles = [...baseRows];
            if (currentCandle) allCandles.push(currentCandle);

            if (allCandles.length === 0) return;

            const padding = 40;
            const candleWidth = (canvas.width - padding * 2) / allCandles.length;

            // Trova min e max per scalare verticalmente
            let maxPrice = Math.max(...allCandles.map(c => c.high));
            let minPrice = Math.min(...allCandles.map(c => c.low));
            let priceRange = maxPrice - minPrice || 1;

            allCandles.forEach((candle, index) => {
                const x = padding + (index * candleWidth);
                
                // Mappatura coordinate Y
                const yOpen = canvas.height - padding - ((candle.open - minPrice) / priceRange) * (canvas.height - padding * 2);
                const yClose = canvas.height - padding - ((candle.close - minPrice) / priceRange) * (canvas.height - padding * 2);
                const yHigh = canvas.height - padding - ((candle.high - minPrice) / priceRange) * (canvas.height - padding * 2);
                const yLow = canvas.height - padding - ((candle.low - minPrice) / priceRange) * (canvas.height - padding * 2);

                const isBullish = candle.close >= candle.open;
                ctx.strokeStyle = isBullish ? '#16a34a' : '#dc2626';
                ctx.fillStyle = isBullish ? '#16a34a' : '#dc2626';

                // Disegna l'ombra (Wick)
                ctx.beginPath();
                ctx.moveTo(x + candleWidth/2, yHigh);
                ctx.lineTo(x + candleWidth/2, yLow);
                ctx.stroke();

                // Disegna il corpo (Body)
                const bodyHeight = Math.abs(yClose - yOpen) || 1;
                ctx.fillRect(x + 2, Math.min(yOpen, yClose), candleWidth - 4, bodyHeight);
            });

            // Mostra l'ultimo prezzo sulla destra
            if(currentCandle) {
                const lastY = canvas.height - padding - ((currentCandle.close - minPrice) / priceRange) * (canvas.height - padding * 2);
                ctx.fillStyle = '#e8c34a';
                ctx.font = '12px sans-serif';
                ctx.fillText(`${activeAsset}: ${currentCandle.close.toFixed(2)}`, canvas.width - 110, lastY + 4);
                
                // Linea tratteggiata del prezzo attuale
                ctx.strokeStyle = 'rgba(232, 195, 74, 0.4)';
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(padding, lastY);
                ctx.lineTo(canvas.width - 120, lastY);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        function updateLiveStats(currentPrice) {
            document.getElementById('stat-pl').innerText = `€${((currentPrice - 2340) * 2).toFixed(2)}`;
        }

        function changeAsset(val) {
            activeAsset = val;
            baseRows = [];
            currentCandle = null;
            generateMockHistory();
            drawChartMock();
        }

        function changeTimeframe(val) {
            timeframeMinutes = parseInt(val);
            baseRows = [];
            currentCandle = null;
            generateMockHistory();
            drawChartMock();
        }

        function toggleModal(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function submitLogin() {
            const email = document.getElementById('apiEmail').value;
            const key = document.getElementById('apiKey').value;
            const pass = document.getElementById('apiPassword').value;
            const isDemo = document.getElementById('apiDemo').checked;
            
            initCapitalLiveStream(email, key, pass, isDemo);
            toggleModal('loginModal');
        }

        function clearSession() {
            baseRows = [];
            currentCandle = null;
            setupCanvas();
            console.log("[Session] Sessione azzerata con successo.");
        }

        // Funzioni vuote di mock per l'interfaccia
        function executeMarketOrder(side) { console.log(`Ordine a mercato inserito: ${side}`); }
        function closeAllPositions() { console.log("Tutte le posizioni chiuse."); }
        function stepBack() { console.log("Backstep storico."); }
        function stepForward() { console.log("Forwardstep storico."); }
        function togglePlay() { isPlaying = !isPlaying; document.getElementById('playBtn').innerText = isPlaying ? "⏸ PAUSA" : "▶ PLAY"; }
        function randomData() { changeAsset(activeAsset); }
    </script>
</body>
</html>
