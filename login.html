<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accedi — Forex Backtest Lab</title>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0b0f14;color:#e8edf3;font-family:Inter,Arial,sans-serif;padding:20px}
  .card{width:100%;max-width:380px;background:#111720;border:1px solid #202832;border-radius:14px;padding:26px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#84909f;font-size:13px;margin:0 0 22px}
  .tabs{display:flex;gap:6px;margin-bottom:18px;background:#0b1117;padding:4px;border-radius:9px}
  .tab{flex:1;text-align:center;padding:8px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:700;color:#8290a0}
  .tab.active{background:#202832;color:#e8edf3}
  .panel{display:none}
  .panel.active{display:block}
  label{display:block;font-size:11px;color:#8290a0;text-transform:uppercase;margin:12px 0 5px}
  input{width:100%;padding:11px;border-radius:8px;border:1px solid #2b3541;background:#0b1117;color:#e8edf3;font-size:14px}
  button{width:100%;padding:12px;border-radius:8px;border:1px solid #2b3541;background:#1a232e;color:#e8edf3;
    font-weight:700;cursor:pointer;margin-top:14px;font-size:14px}
  button.primary{background:#277d5a;border-color:#277d5a}
  button.google{background:#fff;color:#1f1f1f;display:flex;align-items:center;justify-content:center;gap:10px}
  button:disabled{opacity:.6;cursor:default}
  .link-btn{background:none;border:none;color:#3ea6ff;font-size:12px;padding:0;margin-top:10px;cursor:pointer;font-weight:400;text-align:left;text-decoration:underline}
  .error{background:#2a1414;border:1px solid #7a3030;color:#ffb4b4;font-size:12px;padding:9px;border-radius:7px;margin-top:12px;display:none}
  .info{background:#12241c;border:1px solid #235c3f;color:#8fe0b6;font-size:12px;padding:9px;border-radius:7px;margin-top:12px;display:none}
  #recaptcha-container{margin-top:10px}
  /* Pulsante "Installa l'app" mostrato in cima al box di login (indipendente dal popup
     automatico beforeinstallprompt, che su molti browser/dispositivi — iOS Safari in primis —
     non compare mai). Nascosto di default: appare via JS solo quando l'installazione ha senso
     (non se l'app gira già installata in standalone). */
  #installLoginBtn{display:none;width:100%;background:#1a232e;border:1px solid #3ea6ff;
    color:#e8edf3;font-weight:700;border-radius:8px;padding:11px;cursor:pointer;
    margin-bottom:16px;font-size:13px;align-items:center;justify-content:center;gap:8px}
  #installLoginBtn.show{display:flex}
</style>
</head>
<body>

<div class="card">
  <a href="index.html" title="Torna alla home" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;cursor:pointer;margin-bottom:4px">
    <img src="icon-192.png" alt="BacktestLAB" style="width:36px;height:36px;border-radius:9px;object-fit:cover;box-shadow:0 4px 14px rgba(62,166,255,.25);flex:none">
    <div>
      <div style="font-weight:800;letter-spacing:-.02em;font-size:17px;line-height:1;color:#e8edf3">Backtest<span style="color:#3ea6ff">LAB</span></div>
      <div style="font-size:9px;letter-spacing:.22em;color:#7f8b9a;font-weight:700;margin-top:3px">FOREX EDITION</div>
    </div>
  </a>
  <p class="sub">Accedi per continuare</p>

  <button id="installLoginBtn">⬇️ Installa l'app sul dispositivo</button>

  <div id="auth-forms">
    <div class="tabs">
      <div class="tab active" data-panel="panel-email">Email</div>
      <div class="tab" data-panel="panel-google">Google</div>
    </div>

    <!-- EMAIL -->
    <div class="panel active" id="panel-email">
      <label>Email</label>
      <input type="email" id="email-input" autocomplete="email" placeholder="tuo@email.it">
      <label>Password</label>
      <input type="password" id="password-input" autocomplete="current-password" placeholder="••••••••">
      <button class="primary" id="email-signin-btn">Accedi</button>
      <button id="email-signup-btn">Crea un nuovo account</button>
    </div>

    <!-- GOOGLE -->
    <div class="panel" id="panel-google">
      <p class="sub" style="margin-top:0">Accedi con il tuo account Google in un click.</p>
      <button class="google" id="google-signin-btn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Accedi con Google
      </button>
    </div>
  </div>

  <div class="error" id="error-box"></div>
  <div class="info" id="info-box"></div>

  <!-- VERIFY GATE: mostrato quando l'utente è loggato ma non ha verificato l'email -->
  <div id="verify-gate" style="display:none;margin-top:6px">
    <p class="sub" style="margin:0 0 4px">Conferma la tua email per continuare</p>
    <p class="sub" style="margin:0 0 14px" id="verify-gate-email"></p>
    <button class="primary" id="verify-recheck-btn">Ho confermato l'email, continua</button>
    <button id="verify-resend-btn">Invia di nuovo l'email di verifica</button>
    <button class="link-btn" id="verify-logout-btn" style="width:100%;text-align:center;text-decoration:none;margin-top:12px">Esci e usa un altro account</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, onAuthStateChanged,
    signInWithEmailAndPassword, createUserWithEmailAndPassword,
    GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
    sendEmailVerification, reload,
    getAdditionalUserInfo, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, serverTimestamp,
    collection, addDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  let skipAutoRedirect = false;

  // APP MOBILE (Capacitor): dentro il WebView nativo i popup di Google vengono bloccati.
  // Su mobile usiamo percio' il flusso di reindirizzamento (pagina intera) invece del popup.
  const isCapacitor = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

  /* STATO LOGIN GOOGLE: INIZIO
   ---------------------------------------------------------------------------
   CAUSA MISURATA (18 ottobre 2026, telefono e tablet): Firebase conserva lo stato
   del reindirizzamento in sessionStorage, che vive SOLO in memoria del processo.
   Durante la scelta dell'account Google l'app resta in secondo piano e Android puo'
   uccidere il processo: al ritorno sessionStorage e' vuoto e Firebase butta
   "Unable to process request due to missing initial state" — il login non si
   completa e l'utente resta fermo. Il backup in localStorage, che la morte del
   processo NON cancella, lo salva: prima di partire si copia tutto li', al ritorno
   si rimette ogni chiave mancante al suo posto PRIMA di parlare con Firebase.

   La bandierina e' anched essa in localStorage (con il suo orario): in
   sessionStorage morirebbe insieme allo stato che deve ricordare.
   --------------------------------------------------------------------------- */
  const FBL_PENDENTE = 'fblRedirectPending';
  const FBL_ARCHIVIO = 'fblAuthBackup';
  const FBL_SCADENZA = 10 * 60 * 1000; // dieci minuti: un giro da Google non dura di piu'
  function salvaStatoAuth() {
    try {
      const copia = {};
      for (let i = 0; i < sessionStorage.length; i++) {
        const k = sessionStorage.key(i);
        copia[k] = sessionStorage.getItem(k);
      }
      localStorage.setItem(FBL_ARCHIVIO, JSON.stringify(copia));
    } catch (e) { /* magazzino pieno o negato: si prova comunque con la sola bandierina */ }
    try { localStorage.setItem(FBL_PENDENTE, String(Date.now())); } catch (e) {}
  }
  function ripristinaStatoAuth() {
    let pendente = false;
    try {
      const v = localStorage.getItem(FBL_PENDENTE);
      const quando = Number(v);
      pendente = v !== null && quando > 0 &&
        Date.now() - quando < FBL_SCADENZA && quando <= Date.now() + 60000;
    } catch (e) { return false; }
    if (!pendente) {
      // Nessun giro in corso (o troppo vecchio per essere uno): la bandierina vecchia
      // va buttata, altrimenti sopprime l'accesso automatico di chi e' gia' loggato.
      consumaStatoAuth();
      return false;
    }
    try {
      const copia = JSON.parse(localStorage.getItem(FBL_ARCHIVIO) || '{}');
      for (const k in copia) {
        if (sessionStorage.getItem(k) === null) sessionStorage.setItem(k, copia[k]);
      }
    } catch (e) { /* backup illeggibile: si prova con lo stato rimasto */ }
    return true;
  }
  function consumaStatoAuth() {
    try { localStorage.removeItem(FBL_ARCHIVIO); localStorage.removeItem(FBL_PENDENTE); } catch (e) {}
  }
  // Dove andare dopo il login riuscito: dentro l'APP il programma (app.html); sul SITO
  // la porta d'ingresso (index.html?dopo=login), che apre l'app installata o offre
  // l'installazione — vedi il seguito di questa funzione e il test porta_dopo_login.
  function destinazioneLogin(nativa) { return nativa ? 'app.html' : 'index.html?dopo=login'; }
  /* STATO LOGIN GOOGLE: FINE */

  const loginGoogleInCorso = ripristinaStatoAuth();
  if (loginGoogleInCorso) skipAutoRedirect = true;

  // Telefono e tablet nel BROWSER (non nell'app): il puntatore e' grossolano, e li' il
  // popup di Google e' inaffidabile (bloccato o aperto come scheda a parte, e con quello
  // Firebase perde lo stato). Si usa il reindirizzamento a pagina intera, il flusso che
  // Google consiglia su mobile.
  function tocchiGrossi() {
    try { return !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches); } catch (e) { return false; }
  }

  // === La tua configurazione Firebase ===
  const firebaseConfig = {
    apiKey: "AIzaSyCz9y-5d9AxqjDtJPbBYyHaUOYRKDGUaO0",
    authDomain: "forex-backtest-lab.firebaseapp.com",
    projectId: "forex-backtest-lab",
    storageBucket: "forex-backtest-lab.firebasestorage.app",
    messagingSenderId: "808053062225",
    appId: "1:808053062225:web:7ada623415ae1b1a9d5670",
    measurementId: "G-Q6K1XXDP8Q"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Dove andare dopo il login riuscito (deciso dal proprietario, 18 ottobre 2026):
  // DENTRO L'APP resta app.html, che e' il programma. SUL SITO non si finisce piu' nel
  // simulatore nel browser aperto e basta: si torna alla porta d'ingresso della landing
  // (index.html?dopo=login), che prova subito a passare dentro l'app e, se non c'e',
  // offre l'installazione — con sempre l'uscita "Continua col sito web" verso app.html.
  const DESTINATION = destinazioneLogin(isCapacitor);

  // Non passiamo più nessun actionCodeSettings a sendEmailVerification():
  // così Firebase invia l'email di conferma con il suo link standard, che
  // porta alla sua pagina predefinita ("La tua email è stata verificata"),
  // senza nessun pulsante "Continua" verso un URL personalizzato. L'utente,
  // dopo aver confermato, torna semplicemente all'app da solo (scheda già
  // aperta, o riaprendo il sito). Niente più verify-email.html da gestire.

  // Crea il profilo utente con la data di inizio prova gratuita,
  // SOLO se non esiste già (così non si resetta mai una volta creato)
  async function ensureUserProfile(user){
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    if(!snap.exists()){
      await setDoc(ref, {
        email: user.email || null,
        trialStart: serverTimestamp(),
        createdAt: serverTimestamp(),
        subscriptionActive: false
      });
    }
  }

  // Un account creato con email/password richiede la verifica dell'email.
  // Gli account Google sono considerati già verificati da Firebase.
  function isPasswordAccount(user){
    return user.providerData.some(p => p.providerId === "password");
  }

  const authForms = document.getElementById("auth-forms");
  const verifyGate = document.getElementById("verify-gate");
  const verifyGateEmail = document.getElementById("verify-gate-email");

  function showVerifyGate(user){
    authForms.style.display = "none";
    verifyGate.style.display = "block";
    verifyGateEmail.textContent = user.email ? `Email inviata a: ${user.email}` : "";
  }
  function hideVerifyGate(){
    verifyGate.style.display = "none";
    authForms.style.display = "";
  }

  // Se l'utente è già loggato: se ha verificato l'email (o ha fatto accesso con Google)
  // salta subito alla app, altrimenti mostra il gate "conferma la tua email".
  onAuthStateChanged(auth, async (user) => {
    if (!user) { hideVerifyGate(); return; }
    if (isPasswordAccount(user) && !user.emailVerified) {
      showVerifyGate(user);
      return;
    }
    if (skipAutoRedirect) return;
    await ensureUserProfile(user);
    window.location.replace(DESTINATION);
  });

  // AL RITORMO dal reindirizzamento di Google (dentro l'APK o nel browser del telefono):
  // qui si legge il risultato. Lo stato e' gia' stato rimesso al posto da
  // ripristinaStatoAuth() all'avvio (backup + bandierina in localStorage): senza quel
  // passo Firebase butta "missing initial state" e il login non parte.
  if (loginGoogleInCorso) {
    (async () => {
      try {
        const cred = await getRedirectResult(auth);
        consumaStatoAuth();
        if (!cred) {
          // Il giro da Google e' tornato senza credenziale (annullato o perso per strada):
          // si dice, invece di lasciare l'utente fermo senza spiegazioni.
          skipAutoRedirect = false;
          showError("Accesso con Google non riuscito. Tocca di nuovo «Accedi con Google».");
          return;
        }
        const info = getAdditionalUserInfo(cred);
        await ensureUserProfile(cred.user);
        if (info && info.isNewUser) {
          await sendWelcomeEmail(cred.user);
          showInfo("Benvenuto in Forex Backtest Lab! 🎉 Hai 7 giorni di prova gratuita a partire da ora. Accesso all'app tra qualche secondo...");
          setTimeout(()=>window.location.replace(DESTINATION), 3000);
        } else {
          window.location.replace(DESTINATION);
        }
      } catch(e) {
        consumaStatoAuth();
        skipAutoRedirect = false;
        showError(traduciErrore(e && e.code));
      }
    })();
  }

  // Scrive un documento nella collezione "mail": l'estensione Firebase
  // collegata a Brevo se ne occupa e invia l'email vera e propria.
  async function sendWelcomeEmail(user){
    const nome = user.displayName || (user.email ? user.email.split("@")[0] : "Trader");
    try{
      await addDoc(collection(db, "mail"), {
        to: user.email,
        message: {
          subject: `Welcome to Forex Backtest Lab, ${nome}!`,
          html: `
            <h1>Hi Trader! ${nome}</h1>
            <p>Thank you for registering with <strong>Forex Backtest Lab</strong>.</p>
            <p>Just a reminder that the app is free for <strong>7 days</strong>; once that time
            is up, your account will be locked, and you will need to make a payment to continue.</p>
            <p>Happy backtesting — see you soon.<br>The Forex Backtest Lab Team</p>
          `
        }
      });
    }catch(e){
      // Non blocchiamo mai la registrazione se l'invio dell'email fallisce
      console.error("Impossibile accodare l'email di benvenuto:", e);
    }
  }

  const errorBox = document.getElementById("error-box");
  const infoBox = document.getElementById("info-box");
  function showError(msg){ errorBox.textContent = msg; errorBox.style.display="block"; infoBox.style.display="none"; }
  function showInfo(msg){ infoBox.textContent = msg; infoBox.style.display="block"; errorBox.style.display="none"; }
  function clearMsgs(){ errorBox.style.display="none"; infoBox.style.display="none"; }

  // --- Tab switching ---
  document.querySelectorAll(".tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(tab.dataset.panel).classList.add("active");
      clearMsgs();
    });
  });

  // --- EMAIL ---
  document.getElementById("email-signin-btn").addEventListener("click", async ()=>{
    clearMsgs();
    const email = document.getElementById("email-input").value.trim();
    const password = document.getElementById("password-input").value;
    if(!email || !password){ showError("Inserisci email e password."); return; }
    try{
      await signInWithEmailAndPassword(auth, email, password);
    }catch(e){ showError(traduciErrore(e.code)); }
  });

  document.getElementById("email-signup-btn").addEventListener("click", async ()=>{
    clearMsgs();
    const email = document.getElementById("email-input").value.trim();
    const password = document.getElementById("password-input").value;
    if(!email || !password){ showError("Inserisci email e password."); return; }
    if(password.length < 6){ showError("La password deve avere almeno 6 caratteri."); return; }
    try{
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await ensureUserProfile(cred.user);
      await sendEmailVerification(cred.user);
      await sendWelcomeEmail(cred.user);
      showInfo("Benvenuto in Forex Backtest Lab! 🎉 Hai 7 giorni di prova gratuita a partire da ora. Ti abbiamo inviato una email di conferma: aprila e clicca il link, poi torna qui per continuare.");
      showVerifyGate(cred.user);
    }catch(e){ showError(traduciErrore(e.code)); }
  });

  // --- GOOGLE ---
  document.getElementById("google-signin-btn").addEventListener("click", async ()=>{
    clearMsgs();
    skipAutoRedirect = true;
    // SU CAPACITOR (APK): il reindirizzamento (signInWithRedirect) NON funziona,
    // perché Firebase usa redirect URI web (firebaseapp.com/__/auth/handler) che
    // non torna nell'app Capacitor (scheme forexbacktestlab://).
    // Si usa SEMPRE il popup. Il WebView Android moderno supporta i popup
    // se WebChromeClient li gestisce (il nostro build lo fa).
    // SU BROWSER MOBILE (non Capacitor): popup primo, fallback a redirect se bloccato.
    const usaSoloPopup = isCapacitor;
    try{
      const cred = await signInWithPopup(auth, new GoogleAuthProvider());
      const info = getAdditionalUserInfo(cred);
      await ensureUserProfile(cred.user); // idempotente: sicura anche per un utente già esistente
      if (info && info.isNewUser) {
        await sendWelcomeEmail(cred.user);
        showInfo("Benvenuto in Forex Backtest Lab! 🎉 Hai 7 giorni di prova gratuita a partire da ora. Accesso all'app tra qualche secondo...");
        setTimeout(()=>window.location.replace(DESTINATION), 3000);
      } else {
        window.location.replace(DESTINATION);
      }
    }catch(e){
      // Se il popup è bloccato dal browser (non Capacitor), ripiego sul reindirizzamento.
      if (!usaSoloPopup && e && e.code === "auth/popup-blocked") {
        salvaStatoAuth();
        try {
          await signInWithRedirect(auth, new GoogleAuthProvider());
          return;
        } catch(e2) { consumaStatoAuth(); e = e2; }
      }
      // Su Capacitor: niente redirect. Se il popup fallisce per ALTRI motivi,
      // l'errore è mostrato chiaramente (es. rete, cancellazione utente).
      skipAutoRedirect = false;
      showError(traduciErrore(e.code));
    }
  });

  // --- VERIFY GATE ---
  document.getElementById("verify-recheck-btn").addEventListener("click", async ()=>{
    clearMsgs();
    const user = auth.currentUser;
    if(!user){ showError("Sessione scaduta, effettua di nuovo l'accesso."); hideVerifyGate(); return; }
    try{
      await reload(user);
      if(user.emailVerified){
        await ensureUserProfile(user);
        window.location.replace(DESTINATION);
      }else{
        showError("Email non ancora confermata. Controlla la posta (anche lo spam) e clicca il link, poi riprova.");
      }
    }catch(e){ showError(traduciErrore(e.code)); }
  });

  document.getElementById("verify-resend-btn").addEventListener("click", async ()=>{
    clearMsgs();
    const user = auth.currentUser;
    if(!user){ showError("Sessione scaduta, effettua di nuovo l'accesso."); hideVerifyGate(); return; }
    try{
      await sendEmailVerification(user);
      showInfo("Email di verifica inviata di nuovo. Controlla la posta (anche lo spam).");
    }catch(e){ showError(traduciErrore(e.code)); }
  });

  document.getElementById("verify-logout-btn").addEventListener("click", async ()=>{
    clearMsgs();
    await signOut(auth);
    hideVerifyGate();
  });

  // === Pulsante "Installa l'app" (PWA) ===============================================
  // Stessa logica del banner già presente in index.html, ma qui il pulsante è SEMPRE
  // visibile (non un popup che spunta da solo), perché l'evento beforeinstallprompt da cui
  // dipende il popup automatico non spara affatto su alcuni browser/dispositivi (es. iOS
  // Safari), e su Chrome/Edge desktop spesso richiede prima un certo "engagement" con il
  // sito. Registriamo qui anche il service worker: login.html è la prima pagina che molti
  // utenti aprono, quindi è qui che l'app deve risultare installabile fin da subito.
  const installBtn = document.getElementById('installLoginBtn');
  let deferredLoginPrompt = null;

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true; // Safari iOS
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  /* LOGIN SW: INIZIO — provato da laboratorio/app/aggiornamento.test.mjs */
  if ('serviceWorker' in navigator) {
    // {updateViaCache:'none'} — stesso motivo che in app.html: senza questa opzione il
    // confronto byte-per-byte di sw.js può ricevere una copia presa dalla cache HTTP/CDN
    // e non vedere MAI che ne esiste una versione nuova. (Corretto il 18 ottobre 2026:
    // qui mancava.)
    navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(()=>{});
  }
  /* LOGIN SW: FINE */

  if (!isStandalone) {
    if (isIOS) {
      // Su iOS Safari "beforeinstallprompt" non esiste: mostriamo comunque il pulsante,
      // che al click spiega il gesto manuale ("Condividi" → "Aggiungi a Home").
      installBtn.classList.add('show');
    }
    window.addEventListener('beforeinstallprompt', (e)=>{
      e.preventDefault();
      deferredLoginPrompt = e;
      installBtn.classList.add('show');
    });
    window.addEventListener('appinstalled', ()=>{
      deferredLoginPrompt = null;
      installBtn.classList.remove('show');
    });
  }

  installBtn.addEventListener('click', async ()=>{
    if (deferredLoginPrompt) {
      deferredLoginPrompt.prompt();
      try{ await deferredLoginPrompt.userChoice; }catch(e){}
      deferredLoginPrompt = null;
      installBtn.classList.remove('show');
      return;
    }
    if (isIOS) {
      showInfo('Per installare l\'app su iPhone/iPad: tocca il pulsante "Condividi" (il quadrato con la freccia in su) nella barra di Safari, poi "Aggiungi alla schermata Home".');
      return;
    }
    showInfo('Per installare l\'app, cerca la voce "Installa app" nel menu del browser (di solito l\'icona ⋮ o ⋯ in alto a destra).');
  });

  function traduciErrore(code){
    const mappa = {
      "auth/invalid-email": "Email non valida.",
      "auth/user-not-found": "Nessun account trovato con questa email.",
      "auth/wrong-password": "Password errata.",
      "auth/invalid-credential": "Email o password errate.",
      "auth/email-already-in-use": "Esiste già un account con questa email. Prova ad accedere invece di crearne uno nuovo.",
      "auth/weak-password": "Password troppo debole (minimo 6 caratteri).",
      "auth/popup-closed-by-user": "Hai chiuso la finestra di Google prima di completare l'accesso.",
      "auth/popup-blocked": "Il browser ha bloccato la finestra di Google. Consentila per questo sito e riprova.",
      "auth/invalid-argument": "Accesso con Google non riuscito. Tocca di nuovo «Accedi con Google»; se ricapita, chiudi e riapri la pagina.",
      "auth/internal-error": "Accesso con Google non riuscito. Tocca di nuovo «Accedi con Google»; se ricapita, chiudi e riapri la pagina.",
      "auth/too-many-requests": "Troppi tentativi. Riprova tra qualche minuto."
    };
    return mappa[code] || ("Errore: " + code);
  }
</script>
