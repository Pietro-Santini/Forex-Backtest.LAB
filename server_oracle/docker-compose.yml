# Avvio: dalla cartella del progetto,  docker compose -f server_oracle/docker-compose.yml up -d --build
# network_mode host: i servizi ascoltano su 127.0.0.1 del server, e Tailscale Serve (sul server)
# li porta agli altri dispositivi in HTTPS, con la chiave. Nessuna porta aperta su internet.
services:
  ponte:
    build: { context: .., dockerfile: server_oracle/Dockerfile }
    command: ["python", "/fbl/server_oracle/ponte_server.py"]
    network_mode: host
    volumes: ["/srv/fbl/dati:/dati"]
    restart: unless-stopped
  segnali:
    build: { context: .., dockerfile: server_oracle/Dockerfile }
    command: ["python", "/fbl/installer_build/build/segnali_telegram/segnali_bridge.py", "--quiet"]
    network_mode: host
    volumes: ["/srv/fbl/dati:/dati"]
    restart: unless-stopped
