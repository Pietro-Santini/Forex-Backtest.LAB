<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conferma email — Forex Backtest Lab</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0b0f14;color:#e8edf3;font-family:Inter,Arial,sans-serif;padding:20px}
  .card{width:100%;max-width:380px;background:#111720;border:1px solid #202832;border-radius:14px;padding:30px;text-align:center}
  .icon{font-size:40px;margin-bottom:14px}
  h1{font-size:19px;margin:0 0 10px}
  p{color:#a7b1bf;font-size:13.5px;line-height:1.55;margin:0 0 22px}
  a.btn,button.btn{display:block;width:100%;padding:12px;border-radius:8px;background:#277d5a;color:#fff;
    font-weight:700;text-decoration:none;font-size:14px;border:none;cursor:pointer;font-family:inherit}
  a.btn.secondary,button.btn.secondary{background:#1a232e;border:1px solid #2b3541;margin-top:10px;color:#e8edf3}
  button.btn:disabled{opacity:.6;cursor:default}
</style>
</head>
<body>

<div class="card">
  <div class="icon" id="icon">✉️</div>
  <h1 id="title">Conferma la tua email</h1>
  <p id="message">Premi il pulsante qui sotto per completare la verifica del tuo indirizzo email.</p>
  <button class="btn" id="confirm-btn" style="display:none">Conferma la mia email</button>
  <a class="btn" id="back-btn" href="login.html" style="display:none">Torna a Forex Backtest Lab</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, applyActionCode } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // === La tua configurazione Firebase ===
  const firebaseConfig = {
    apiKey: "AIzaSyCz9y-5d9AxqjDtJPbBYyHaUOYRKDGUaO0",
    authDomain: "forex-backtest-lab.firebaseapp.com",
    projectId: "forex-backtest-lab",
    storageBucket: "forex-backtest-lab.firebasestorage.app",
    messagingSenderId: "808053062225",
    appId: "1:808053062225:web:7ada623415ae1b1a9d5670",
    measurementId: "G-Q6K1XXDP8Q"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const iconEl = document.getElementById("icon");
  const titleEl = document.getElementById("title");
  const messageEl = document.getElementById("message");
  const confirmBtn = document.getElementById("confirm-btn");
  const backBtn = document.getElementById("back-btn");

  function showResult(icon, title, message, btnLabel){
    iconEl.textContent = icon;
    titleEl.textContent = title;
    messageEl.textContent = message;
    confirmBtn.style.display = "none";
    backBtn.style.display = "block";
    backBtn.textContent = btnLabel;
  }

  const params = new URLSearchParams(window.location.search);
  const mode = params.get("mode");
  const oobCode = params.get("oobCode");

  // IMPORTANTE: qui NON chiamiamo più applyActionCode automaticamente al
  // caricamento della pagina. Se lo facessimo, uno scanner automatico di
  // email (Outlook Safe Links, antivirus, ecc.) che visita il link per
  // controllarlo prima che l'utente lo apra consumerebbe il codice al posto
  // suo. Ora il codice viene usato solo quando l'utente clicca davvero
  // il pulsante "Conferma la mia email".
  if (mode !== "verifyEmail" || !oobCode) {
    showResult("⚠️", "Link non valido", "Questo link di conferma non è valido o è già stato usato.", "Torna a Forex Backtest Lab");
  } else {
    confirmBtn.style.display = "block";
    confirmBtn.addEventListener("click", async () => {
      confirmBtn.disabled = true;
      confirmBtn.textContent = "Verifica in corso...";
      try {
        await applyActionCode(auth, oobCode);
        showResult("✅", "Email confermata!", "Il tuo indirizzo è stato verificato con successo. Ora puoi accedere e iniziare a usare l'app.", "Torna a Forex Backtest Lab");
      } catch (e) {
        if (e.code === "auth/invalid-action-code") {
          // Il codice è già stato usato: quasi sempre perché l'email è già
          // stata confermata in precedenza (es. hai già cliccato il pulsante).
          showResult("✅", "Email già confermata", "Questo link è già stato usato, ma la tua email risulta già verificata. Puoi accedere normalmente.", "Vai al login");
        } else {
          const messaggi = {
            "auth/expired-action-code": "Questo link è scaduto. Richiedi una nuova email di verifica dalla pagina di accesso.",
            "auth/user-disabled": "Questo account è stato disabilitato.",
          };
          showResult("⚠️", "Verifica non riuscita", messaggi[e.code] || ("Errore: " + e.code), "Torna a Forex Backtest Lab");
        }
      }
    });
  }
</script>
</body>
</html>
